[package]
name = "panoply"
version = "0.1.0"
edition = "2021"

[features]
default = ["editor"]
# The editor (`panoply_editor`, D37) and hot reload of embedded shaders.
editor = ["dep:panoply_editor", "bevy/embedded_watcher"]

[workspace]
members = [
  "crates/panoply_core",
  "crates/panoply_editor",
  "crates/panoply_exemplar",
  "crates/panoply_render",
  "crates/panoply_scenery",
  "crates/panoply_terrain",
]

[workspace.dependencies]
# Bevy is named by branch, exactly as every repo in the family names it: Cargo treats a branch and
# a rev as different sources even at the same commit. Cargo.lock holds the commit.
bevy = { git = "https://github.com/bevyengine/bevy.git", branch = "main", features = [
  "bevy_animation",
  "bevy_dev_tools",
  # BRP, for the remote driver (`src/remote_driver.rs`), and `Image`'s serialization, which its
  # screenshots need.
  "bevy_remote",
  "render_dev_tools",
  "bevy_settings",
  "dynamic_linking",
  "file_watcher",
  "serialize",
  "zlib",
] }
bevy_action_map = { git = "https://github.com/viridia/bevy_action_map.git", branch = "main" }
# The fork's `bevy-main` branch names Bevy main by branch, as this repo does (D34).
bevy_immediate = { git = "https://github.com/viridia/bevy_immediate", branch = "bevy-main" }
bitflags = "2.4.2"
earcutr = "0.4.3"
futures-lite = "2.2.0"
lru = "0.11.0"
panoply_core = { path = "crates/panoply_core" }
panoply_editor = { path = "crates/panoply_editor" }
panoply_exemplar = { path = "crates/panoply_exemplar" }
panoply_render = { path = "crates/panoply_render" }
panoply_scenery = { path = "crates/panoply_scenery" }
panoply_terrain = { path = "crates/panoply_terrain" }
rapier3d = { version = "0.36.1", features = ["debug-render"] }
rmp-serde = "1.1.2"
ron = "0.8.1"
serde = "1.0.217"
serde_json = "1.0.103"
serde_repr = "0.1.16"
serde_bytes = "0.11.12"
thiserror = "1.0.57"

[dependencies]
bevy = { workspace = true }
bevy_action_map = { workspace = true }
panoply_core = { workspace = true }
panoply_editor = { workspace = true, optional = true }
panoply_exemplar = { workspace = true }
panoply_render = { workspace = true }
panoply_scenery = { workspace = true }
panoply_terrain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# TODO(bevy-0.20): restore these dependencies along with the modules that use them.
# base64 = "0.22.0"
# bevy-inspector-egui = "0.28.1"                     # pins bevy 0.15; replace or bump
# bitflags = { workspace = true }
# i_overlay = "1.4.2"                                # editor
# regex = "1.10.6"
# serde_bytes = { workspace = true }
# serde_derive = "1.0.171"
# serde_repr = { workspace = true }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
