[package]
name = "panoply"
version = "0.1.0"
edition = "2021"

[features]
default = ["editor"]
editor = []          # Enable editor features

[workspace]
members = ["crates/panoply_core"]
# TODO(bevy-0.20): restore these crates to the workspace as they are ported.
exclude = ["crates/bevy_saga", "crates/panoply_exemplar", "crates/panoply_terrain"]

[workspace.dependencies]
bevy = { version = "0.20.0", features = [
  "bevy_animation",
  "bevy_settings",
  "dynamic_linking",
  "file_watcher",
  "serialize",
] }
bitflags = "2.4.2"
lru = "0.11.0"
panoply_core = { path = "crates/panoply_core" }
panoply_exemplar = { path = "crates/panoply_exemplar" }
panoply_terrain = { path = "crates/panoply_terrain" }
bevy_saga = { path = "crates/bevy_saga" }
rapier3d = { version = "0.22.0" }
rmp-serde = "1.1.2"
ron = "0.8.1"
serde = "1.0.217"
serde_json = "1.0.103"
serde_repr = "0.1.16"
serde_bytes = "0.11.12"
thiserror = "1.0.57"

[dependencies]
bevy = { workspace = true }
panoply_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# TODO(bevy-0.20): restore these dependencies along with the modules that use them.
# base64 = "0.22.0"
# bevy_saga = { workspace = true }                   # scripting
# bevy-inspector-egui = "0.28.1"                     # pins bevy 0.15; replace or bump
# bitflags = { workspace = true }
# earcutr = "0.4.3"                                  # scenery
