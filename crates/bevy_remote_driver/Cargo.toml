# Forked from bevy_action_map's `crates/bevy_remote_driver` at f641559.
[package]
name = "bevy_remote_driver"
description = "Drive a running Bevy app from outside for automated tests, over the Bevy Remote Protocol"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Subcrates rather than the umbrella: the server methods are candidates for upstream.
[dependencies]
bevy_app = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_camera = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_diagnostic = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_ecs = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_reflect = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_remote = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false, features = ["http"] }
bevy_scene = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_ui = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_window = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
