[package]
name = "panoply"
version = "0.1.0"
edition = "2021"

[features]
default = ["editor"]
editor = ["bevy/embedded_watcher"] # Enable editor features; hot reload of embedded shaders

[workspace]
members = [
  "crates/bevy_remote_driver",
  "crates/panoply_core",
  "crates/panoply_exemplar",
  "crates/panoply_terrain",
]

[workspace.dependencies]
bevy = { version = "0.20.0", features = [
  "bevy_animation",
  "bevy_dev_tools",
  "render_dev_tools",
  "bevy_settings",
  "dynamic_linking",
  "file_watcher",
  "serialize",
] }
bitflags = "2.4.2"
lru = "0.11.0"
panoply_core = { path = "crates/panoply_core" }
panoply_exemplar = { path = "crates/panoply_exemplar" }
panoply_terrain = { path = "crates/panoply_terrain" }
rapier3d = { version = "0.22.0" }
rmp-serde = "1.1.2"
ron = "0.8.1"
serde = "1.0.217"
serde_json = "1.0.103"
serde_repr = "0.1.16"
serde_bytes = "0.11.12"
thiserror = "1.0.57"

[dependencies]
bevy = { workspace = true }
bevy_action_map = "0.1.2"
# Inert unless BEVY_REMOTE_DRIVER_PORT is set; see crates/bevy_remote_driver.
bevy_remote_driver = { path = "crates/bevy_remote_driver" }
futures-lite = "2.2.0"
lru = { workspace = true }
panoply_core = { workspace = true }
panoply_exemplar = { workspace = true }
panoply_terrain = { workspace = true }
rapier3d = { workspace = true }
rmp-serde = { workspace = true }
earcutr = "0.4.3"
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# TODO(bevy-0.20): restore these dependencies along with the modules that use them.
# base64 = "0.22.0"
# bevy-inspector-egui = "0.28.1"                     # pins bevy 0.15; replace or bump
# bitflags = { workspace = true }
# i_overlay = "1.4.2"                                # editor
# regex = "1.10.6"
# serde_bytes = { workspace = true }
# serde_derive = "1.0.171"
# serde_repr = { workspace = true }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
